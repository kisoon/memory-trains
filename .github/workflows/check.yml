name: Validate web and ESP32-S3 firmware
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
        working-directory: web
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - name: Install pinned core and library
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.3.0
          arduino-cli lib install ArduinoJson@7.4.2
      - name: Compile ESP32-S3 (example settings only)
        run: |
          cp hardware/train_controller/config.example.h hardware/train_controller/config.h
          arduino-cli compile --fqbn esp32:esp32:esp32s3 hardware/train_controller
